<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0e12">
  <title>NotPikachu Army</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#inicio" data-route="inicio">NotPikachu Army</a>
      <nav>
        <button class="nav-btn active" data-page="inicio">Inicio</button>
        <button class="nav-btn" data-page="calendario">Calendario</button>
        <button class="nav-btn" data-page="catalogo">Juegos/Series</button>
      </nav>
      <div class="socials">
        <a href="https://www.twitch.tv/elrandes" target="_blank" rel="noopener">Twitch</a>
        <a href="https://www.youtube.com/@elrandes" target="_blank" rel="noopener">YouTube</a>
        <a href="https://www.youtube.com/@ElRandesDirectos" target="_blank" rel="noopener">Directos</a>
        <a href="https://twitter.com/El_Randes" target="_blank" rel="noopener">Twitter</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="inicio" class="page active">
      <div class="intro">
        <p class="eyebrow">BIENVENIDO</p>
        <h1>NotPikachu Army</h1>
        <p>La NotPikachu army, es la comunidad de Randes. Bienvenido a la familia.</p>
      </div>
    </section>

    <section id="calendario" class="page">
      <div class="page-top">
        <div>
          <p class="eyebrow">CALENDARIO</p>
          <h1>¿Qué toca hoy?</h1>
        </div>
        <label class="timezone-control">
          <span>Horario</span>
          <select id="timezoneSelect"></select>
        </label>
      </div>

      <div id="today"></div>

      <div class="subnav">
        <button class="sub-btn active" data-subpage="semana">Semana</button>
        <button class="sub-btn" data-subpage="stats">Estadísticas</button>
      </div>

      <div id="semana" class="subpage active">
        <div class="week-heading">
          <button id="prevWeek" class="square-btn">←</button>
          <strong id="weekTitle"></strong>
          <button id="todayWeek" class="week-today">Hoy</button>
          <button id="nextWeek" class="square-btn">→</button>
        </div>
        <div class="week-scroll"><div id="week" class="week-grid"></div></div>
      </div>

      <div id="stats" class="subpage">
        <div id="statsContent"></div>
      </div>
    </section>

    <section id="catalogo" class="page">
      <div class="page-top">
        <div>
          <p class="eyebrow">CATÁLOGO</p>
          <h1>Juegos/Series</h1>
        </div>
      </div>
      <div class="catalog-tabs">
        <button class="catalog-btn active" data-catalog="juegos">Juegos</button>
        <button class="catalog-btn" data-catalog="series">Series</button>
      </div>

      <div id="catalog-juegos" class="catalog-page active">
        <div id="gamesList" class="games-grid"></div>
      </div>
      <div id="catalog-series" class="catalog-page">
        <div id="seriesList" class="series-grid"></div>
      </div>
      <div id="catalog-detail" class="catalog-page"></div>
    </section>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <span>NotPikachu Army</span>
      <div class="socials">
        <a href="https://www.twitch.tv/elrandes" target="_blank" rel="noopener">Twitch</a>
        <a href="https://www.youtube.com/@elrandes" target="_blank" rel="noopener">YouTube</a>
        <a href="https://www.youtube.com/@ElRandesDirectos" target="_blank" rel="noopener">Directos</a>
        <a href="https://twitter.com/El_Randes" target="_blank" rel="noopener">Twitter</a>
      </div>
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
